[project]
name = "document-cnn-classifier"
version = "0.1.0"
description = "Reproducible CNN-based document image classification"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.5",
    "torchvision>=0.20",
]

[project.scripts]
document-cnn-train = "cnn_classifier.train:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["cnn_classifier*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
